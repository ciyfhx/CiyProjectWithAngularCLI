<div class="anime-home">

  <div class="search">
      <mat-form-field class="search-field">
          <input matInput placeholder="Search Query" style="float: left;" [(ngModel)]="query">
        </mat-form-field>
        <button mat-raised-button color="primary" (click)="search()" style="float: right; margin-top: 15px;">Search</button>
    </div>
  <mat-paginator [length]="length"  style="clear: left;"
  
                (page)="updateContent($event)">
  </mat-paginator>
  <div class="wrapper" id="animes" [@animes]="animes.length">
  <div  *ngFor="let anime of animes">
  <mat-card class="anime-card" >
    <div class="anime-content">
      <mat-card-header>
          <mat-card-title> <b style="font-size: 1em"> {{anime.title}}</b></mat-card-title>
        </mat-card-header>
      <mat-card-content >
        <div class="center">
            <img  [src]="anime.image_url" />
        </div>
        <p> {{anime.description}}</p>
        </mat-card-content>
        <mat-card-actions>
            <button mat-raised-button color="primary" [routerLink]="['/detail', anime.id]">Detail</button>
          </mat-card-actions>
        </div>
  </mat-card>
    
  </div>
    
  </div>
  
</div>
