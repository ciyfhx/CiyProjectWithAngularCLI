<div class="anime-detail">
    <mat-card *ngIf="anime else loading" class="anime-card" >
        <div class="anime-content">
          <mat-card-header>
              <mat-card-title> <b style="font-size: 2em"> {{anime.title}}</b></mat-card-title>
            </mat-card-header>
          <mat-card-content >
            <div class="top">
                <div class="side-left">
                    <img [src]="anime.image_url" />
                </div>
                <div class="side-right">
                    <star-rating-comp [starType]="'svg'" 
                                      [readOnly]="true" 
                                      [numOfStars]="5" 
                                      [showHalfStars]="true" 
                                      [rating]="anime.score / 10 * 5" style="float: left"></star-rating-comp>
                  <p style="clear: both;">{{anime.synopsis}}</p>
                </div>
             </div>
             <div class="bottom">
               
            </div>
            
            <!-- <div class="episodes">
                <mat-accordion>
                    <mat-expansion-panel>
                      <mat-expansion-panel-header>
                        <mat-panel-title>
                          Episodes
                        </mat-panel-title>
                      </mat-expansion-panel-header>
                  
                      <mat-list>
                          <mat-list-item #ngFor="let episode of episodes"> Pepper </mat-list-item>
                          <mat-list-item> Salt </mat-list-item>
                          <mat-list-item> Paprika </mat-list-item>
                      </mat-list>
                         
                    </mat-expansion-panel>
                  </mat-accordion>
                  
              </div>-->
            </mat-card-content>
            </div> 
      </mat-card>
      <ng-template #loading>
          <mat-progress-bar mode="buffer"></mat-progress-bar>
      </ng-template>
</div>
